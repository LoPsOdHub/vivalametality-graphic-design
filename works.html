<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Platon — Works</title>
<meta name="description" content="Platon's selected work — UX/UI, branding, and design projects." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css?v=24" />
</head>
<body>

<nav class="nav nav--static">
  <a class="nav__mark" href="index.html" aria-label="Platon — home">
    <span class="stamp">56</span>
  </a>
  <ul class="nav__links">
    <li><a href="index.html">Home</a></li>
    <li><a href="works.html?cat=ux-ui">UX/UI</a></li>
    <li><a href="works.html?cat=branding">Branding</a></li>
    <li><a href="works.html?cat=designs">Designs</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="about.html">About</a></li>
  </ul>
</nav>

<main>
  <!--
    All four views below are hidden by default and switched on by
    js/works-page.js based on the URL:
      ?p=<projectId>    → PROJECT DETAIL  (one project's own case-study page)
      ?cat=<categoryId> → CATEGORY GRID   (that tab's list of projects)
      neither           → OVERVIEW       (all three categories, stacked)
      ?p= that doesn't match anything → NOT FOUND
  -->

  <section class="work-hero" id="projectDetail" hidden>
    <a class="work-back" id="projectBack" href="works.html">Back</a>

    <div class="work-hero__meta">
      <span class="work-hero__medium" id="projectMedium"></span>
      <h1 class="work-hero__title" id="projectTitle"></h1>
      <p class="work-hero__desc" id="projectDesc"></p>
      <a class="work-hero__site" id="projectSite" target="_blank" rel="noopener" hidden></a>
    </div>

    <div class="project-gallery" id="projectGallery"></div>
  </section>

  <section class="section works" id="categoryView" hidden>
    <div class="section__head">
      <h2 class="section__title" id="categoryTitle"></h2>
    </div>
    <div class="grid" id="categoryGrid"></div>
  </section>

  <!-- Shown together with #overviewView right after it when a ?p=/?cat=
       didn't match anything — "see the full list below" only holds up
       because this sits above that list in source order. -->
  <section class="work-hero" id="notFound" hidden>
    <a class="work-back" href="works.html">Back to Works</a>
    <div class="work-hero__meta">
      <h1 class="work-hero__title">Not found</h1>
      <p class="work-hero__desc">That link didn't match anything here — it may be a typo or an old link. See the full list below.</p>
    </div>
  </section>

  <!-- Filled in with one .section per category (see js/works-page.js's
       renderOverview) — kept as JS-built sections rather than three
       near-identical blocks here, same pattern as the grids above. -->
  <div id="overviewView" hidden></div>
</main>

<footer class="footer">
  <span>2026 Vivalamentality. All rights reserved.</span>
  <a href="index.html">Back to home</a>
</footer>

<script type="module" src="js/works-page.js?v=14"></script>
</body>
</html>
